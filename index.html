<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>SonicPesa — The High-Speed Payment Grid</title>
    <meta
      name="description"
      content="SonicPesa is a modern payment system for merchants in Africa. Deploy in minutes, scale to millions, and accept payments through Tanzania's leading mobile-money networks."
    />
    <meta
      name="keywords"
      content="SonicPesa, payments, payment infrastructure, merchant payments, fintech, Tanzania, Africa, M-Pesa, Tigo Pesa, Halopesa, Airtel Money, payment API, mobile money"
    />
    <meta name="author" content="SonicPesa" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sonicpesa.com/" />

    <meta
      name="theme-color"
      content="#1F2328"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />

    <!-- Favicon / touch icons -->
    <link rel="icon" type="image/png" href="/images/mainlogo.png" />
    <link rel="apple-touch-icon" href="/images/mainlogo.png" />
    <link rel="shortcut icon" href="/images/mainlogo.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SonicPesa" />
    <meta
      property="og:title"
      content="SonicPesa — The High-Speed Payment Grid"
    />
    <meta
      property="og:description"
      content="A modern payment system for merchants across Africa. Deploy in minutes, scale to millions, and accept payments through Tanzania's leading mobile-money networks."
    />
    <meta
      property="og:image"
      content="https://sonicpesa.com/images/mainlogo.png"
    />
    <meta property="og:url" content="https://sonicpesa.com/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SonicPesa — The High-Speed Payment Grid"
    />
    <meta
      name="twitter:description"
      content="A modern payment system for merchants across Africa. Fast deployment, scalable payment infrastructure, secure APIs, analytics, and mobile-money integration."
    />
    <meta
      name="twitter:image"
      content="https://sonicpesa.com/images/mainlogo.png"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SonicPesa",
        "url": "https://sonicpesa.com/",
        "logo": "https://sonicpesa.com/images/mainlogo.png",
        "description": "SonicPesa is a modern payment system for merchants across Africa, providing scalable payment infrastructure, secure APIs, analytics, and mobile-money integration.",
        "sameAs": []
      }
    </script>

    <!-- Preconnect for the custom heading font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
