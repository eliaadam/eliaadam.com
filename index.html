<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>
      MaishaSoft — Find, transact, and deliver with connected software
    </title>
    <meta
      name="description"
      content="MaishaSoft builds the software, platforms, and partnerships that connect people and businesses — from discovery, through a secure transaction, to delivery."
    />
    <meta
      name="keywords"
      content="MaishaSoft, SaaS, digital platforms, secure transactions, logistics, delivery technology, business software"
    />
    <meta name="author" content="MaishaSoft" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.maishasoft.com/" />
    <meta
      name="theme-color"
      content="#1F2328"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />

    <!-- Favicon / touch icons — sourced from the same logo asset -->
    <link rel="icon" type="image/png" href="/images/mainlogo.png" />
    <link rel="apple-touch-icon" href="/images/mainlogo.png" />
    <link rel="shortcut icon" href="/images/mainlogo.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MaishaSoft" />
    <meta
      property="og:title"
      content="MaishaSoft — Find, transact, and deliver with connected software"
    />
    <meta
      property="og:description"
      content="MaishaSoft builds the software, platforms, and partnerships that connect people and businesses — from discovery, through a secure transaction, to delivery."
    />
    <meta
      property="og:image"
      content="https://www.maishasoft.com/images/mainlogo.png"
    />
    <meta property="og:url" content="https://www.maishasoft.com/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MaishaSoft — Find, transact, and deliver with connected software"
    />
    <meta
      name="twitter:description"
      content="MaishaSoft builds the software, platforms, and partnerships that connect people and businesses."
    />
    <meta
      name="twitter:image"
      content="https://www.maishasoft.com/images/mainlogo.png"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MaishaSoft",
        "url": "https://www.maishasoft.com/",
        "logo": "https://www.maishasoft.com/images/mainlogo.png",
        "description": "MaishaSoft builds the software, platforms, and partnerships that connect people and businesses — from discovery, through a secure transaction, to delivery.",
        "sameAs": []
      }
    </script>

    <!-- Preconnect for the custom heading font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
